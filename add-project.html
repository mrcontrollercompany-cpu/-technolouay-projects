
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة إضافة مشروع — TechnoLouay</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050810; --bg2: #0d1526; --accent: #00d4ff; --accent3: #06ffa5;
  --text: #e2e8f0; --muted: #64748b; --border: rgba(0,212,255,0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Cairo', sans-serif; min-height: 100vh;
  padding: 30px 20px; line-height: 1.7;
}
.wrap { max-width: 780px; margin: 0 auto; }
h1 {
  font-family: 'Orbitron', monospace; color: var(--accent);
  font-size: 1.3rem; text-align: center; margin-bottom: 8px;
}
.sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 30px; }
.field { margin-bottom: 18px; }
label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--accent3); }
input, textarea, select {
  width: 100%; padding: 12px 14px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: 'Cairo', sans-serif; font-size: 0.92rem;
  outline: none; transition: border-color 0.2s; resize: vertical;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { min-height: 180px; line-height: 1.9; }
.hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.btn {
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: white; border: none; border-radius: 8px;
  font-family: 'Cairo', sans-serif; font-size: 1.05rem; font-weight: 700;
  cursor: pointer; margin-top: 10px; transition: transform 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.output-box {
  margin-top: 26px; display: none;
}
.output-box.show { display: block; }
.output-label {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.copy-btn {
  padding: 7px 16px; background: rgba(6,255,165,0.1);
  border: 1px solid var(--accent3); color: var(--accent3);
  border-radius: 6px; cursor: pointer; font-family: 'Cairo'; font-size: 0.8rem; font-weight: 600;
  transition: all 0.2s;
}
.copy-btn:hover { background: rgba(6,255,165,0.2); }
.copy-btn.copied { background: var(--accent3); color: var(--bg); }
pre {
  background: #01040a; border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; overflow-x: auto; font-size: 0.82rem;
  direction: ltr; text-align: left; color: #a5f3fc; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
}
.row { display: flex; gap: 12px; }
.row .field { flex: 1; }
.note {
  background: rgba(0,212,255,0.05); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; font-size: 0.82rem; color: var(--muted);
  margin-top: 20px;
}
.note b { color: var(--accent); }
@media (max-width: 500px) { .row { flex-direction: column; gap: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ أداة إضافة مشروع</h1>
  <p class="sub">املأ الحقول، الصق الوصف كما هو، واحصل على كود JSON جاهز</p>

  <div class="row">
    <div class="field">
      <label>رقم المشروع (id)</label>
      <input type="number" id="id" placeholder="مثال: 8">
    </div>
    <div class="field">
      <label>التخصص</label>
      <select id="category">
        <option>طبية</option>
        <option>ميكاترونكس</option>
        <option>ذكاء اصطناعي</option>
        <option>طاقة</option>
        <option>حواسيب</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>عنوان المشروع</label>
    <input type="text" id="title" placeholder="مثال: الصيدلية الذكية">
  </div>

  <div class="field">
    <label>الوصف الكامل (الصقه كما هو — بأسطره الطبيعية)</label>
    <textarea id="description" placeholder="فكرة المشروع:&#10;&#10;1. بوابة ذكية...&#10;2. نظام استشعار...&#10;&#10;🎯 هدف المشروع:&#10;..."></textarea>
    <div class="hint">الصق النص عادي مع ضغطات Enter الطبيعية — الأداة تتكفل بالباقي.</div>
  </div>

  <div class="row">
    <div class="field">
      <label>رابط الصورة (اختياري)</label>
      <input type="text" id="image" placeholder="images/pharmacy.png">
    </div>
    <div class="field">
      <label>رابط يوتيوب (اختياري)</label>
      <input type="text" id="youtube" placeholder="https://youtube.com/watch?v=...">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>رابط إنستغرام (اختياري)</label>
      <input type="text" id="instagram" placeholder="https://instagram.com/p/...">
    </div>
    <div class="field">
      <label>الوسوم (مفصولة بفاصلة)</label>
      <input type="text" id="tags" placeholder="Arduino, أتمتة, IoT">
    </div>
  </div>

  <button class="btn" onclick="generate()">🔄 توليد كود JSON</button>

  <div class="output-box" id="outputBox">
    <div class="output-label">
      <label style="margin:0">✅ الكود الجاهز — انسخه وأضفه لملف projects.json</label>
      <button class="copy-btn" id="copyBtn" onclick="copyJson()">📋 نسخ</button>
    </div>
    <pre id="output"></pre>
  </div>

  <div class="note">
    <b>كيف تستخدمه:</b> بعد النسخ، افتح <b>projects.json</b> على GitHub. الصق الكود داخل القوسين <b>[ ]</b>. لو عندك مشاريع سابقة، ضع فاصلة <b>,</b> قبل المشروع الجديد.
  </div>
</div>

<script>
function generate() {
  const id = parseInt(document.getElementById('id').value) || 1;
  const title = document.getElementById('title').value.trim();
  const category = document.getElementById('category').value;
  const descRaw = document.getElementById('description').value;
  const image = document.getElementById('image').value.trim();
  const youtube = document.getElementById('youtube').value.trim();
  const instagram = document.getElementById('instagram').value.trim();
  const tagsRaw = document.getElementById('tags').value.trim();

  // Split description into array of lines (preserves empty lines between paragraphs)
  const descLines = descRaw.replace(/\r\n/g, '\n').split('\n').map(l => l.trimEnd());

  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

  const obj = {
    id: id,
    title: title,
    category: category,
    description: descLines,
    images: image ? [image] : [],
    youtube: youtube,
    instagram: instagram,
    tags: tags
  };

  const json = JSON.stringify(obj, null, 2);
  document.getElementById('output').textContent = json;
  document.getElementById('outputBox').classList.add('show');
  document.getElementById('outputBox').scrollIntoView({ behavior: 'smooth' });
}

function copyJson() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ تم النسخ';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 نسخ'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
